changelog:
  categories:
    - title: "🚀 Features"
      labels:
        - "feature"
        - "enhancement"
    - title: "🐛 Fixes"
      labels:
        - "bug"
        - "fix"
    - title: "🔐 Security"
      labels:
        - "security"
    - title: "📚 Documentation"
      labels:
        - "documentation"
        - "docs"
    - title: "🛠 Maintenance"
      labels:
        - "chore"
        - "dependencies"
    - title: "Other Changes"
      labels:
        - "*"
