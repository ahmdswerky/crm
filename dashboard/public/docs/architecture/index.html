<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Estate CRM — Architecture</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f2ec;
      --panel: #fffdf8;
      --border: #d9d3c4;
      --text: #22201b;
      --muted: #6b6558;
      --accent: #7c5cff;
      --accent-fg: #fff;
      --btn-bg: #fffdf8;
      --btn-active: #22201b;
      --btn-active-fg: #fffdf8;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #14130f;
        --panel: #1c1a15;
        --border: #35322a;
        --text: #ece7db;
        --muted: #9a9382;
        --accent: #a48bff;
        --accent-fg: #14130f;
        --btn-bg: #1c1a15;
        --btn-active: #ece7db;
        --btn-active-fg: #14130f;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #14130f;
      --panel: #1c1a15;
      --border: #35322a;
      --text: #ece7db;
      --muted: #9a9382;
      --accent: #a48bff;
      --accent-fg: #14130f;
      --btn-bg: #1c1a15;
      --btn-active: #ece7db;
      --btn-active-fg: #14130f;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .toolbar {
      flex: none;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 18px;
      padding: 10px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .brand {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      letter-spacing: 0.01em;
      margin-right: 4px;
    }
    .brand span { color: var(--muted); font-style: italic; }

    .group {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .group button {
      appearance: none;
      border: 0;
      border-left: 1px solid var(--border);
      background: var(--btn-bg);
      color: var(--text);
      font: inherit;
      padding: 6px 13px;
      cursor: pointer;
    }
    .group button:first-child { border-left: 0; }
    .group button:hover { background: color-mix(in srgb, var(--accent) 14%, var(--btn-bg)); }
    .group button[aria-pressed="true"] {
      background: var(--btn-active);
      color: var(--btn-active-fg);
    }

    .spacer { flex: 1 1 auto; }

    .icon-btn {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--btn-bg);
      color: var(--text);
      font: inherit;
      padding: 6px 13px;
      cursor: pointer;
    }
    .icon-btn:hover { background: color-mix(in srgb, var(--accent) 14%, var(--btn-bg)); }

    .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }

    .frame-wrap { flex: 1 1 auto; min-height: 0; position: relative; }
    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
    }
    noscript { display: block; padding: 24px; }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="brand">Real Estate CRM <span>architecture</span></div>

    <span class="label">Env</span>
    <div class="group" id="env-group" role="group" aria-label="Environment">
      <button data-env="dev">Dev</button>
      <button data-env="prod">Prod</button>
    </div>

    <span class="label">View</span>
    <div class="group" id="view-group" role="group" aria-label="Diagram">
      <button data-view="architecture">Architecture</button>
      <button data-view="workflow">Workflow</button>
      <button data-view="sequence">Sequence</button>
    </div>

    <span class="spacer"></span>

    <button class="icon-btn" id="theme-btn" title="Toggle light / dark"></button>
    <button class="icon-btn" id="present-btn" title="Presentation mode (fullscreen)">Present</button>
    <a class="icon-btn" id="open-btn" target="_blank" rel="noopener" title="Open this diagram in a new tab">Open ↗</a>
  </div>

  <div class="frame-wrap">
    <iframe id="frame" title="Architecture diagram" allow="fullscreen" allowfullscreen></iframe>
    <noscript>This viewer needs JavaScript. Open a diagram directly:
      <a href="prod/architecture.html">prod/architecture.html</a>.
    </noscript>
  </div>

  <script>
    (function () {
      var ENVS = ['dev', 'prod'];
      var VIEWS = ['architecture', 'workflow', 'sequence'];
      var KEY = 'crm-arch-view';

      var frame = document.getElementById('frame');
      var themeBtn = document.getElementById('theme-btn');
      var presentBtn = document.getElementById('present-btn');
      var openBtn = document.getElementById('open-btn');

      var state = load();

      function load() {
        var s = { env: 'prod', view: 'architecture', theme: preferredTheme() };
        try {
          var saved = JSON.parse(localStorage.getItem(KEY) || '{}');
          if (ENVS.indexOf(saved.env) >= 0) s.env = saved.env;
          if (VIEWS.indexOf(saved.view) >= 0) s.view = saved.view;
          if (saved.theme === 'light' || saved.theme === 'dark') s.theme = saved.theme;
        } catch (_) {}
        var h = parseHash();
        if (h) { s.env = h.env; s.view = h.view; }
        return s;
      }
      function preferredTheme() {
        try { return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
        catch (_) { return 'dark'; }
      }
      function parseHash() {
        var m = /^#\/?([a-z]+)\/([a-z]+)$/.exec(location.hash || '');
        if (m && ENVS.indexOf(m[1]) >= 0 && VIEWS.indexOf(m[2]) >= 0) return { env: m[1], view: m[2] };
        return null;
      }
      function persist() {
        try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (_) {}
        try { localStorage.setItem('archify-theme', state.theme); } catch (_) {}
      }

      var present = false;

      function frameSrc() {
        return state.env + '/' + state.view + '.html?theme=' + state.theme + (present ? '&present=1' : '');
      }

      function render() {
        document.documentElement.setAttribute('data-theme', state.theme);
        themeBtn.textContent = state.theme === 'dark' ? 'Light' : 'Dark';
        presentBtn.textContent = present ? 'Exit' : 'Present';
        presentBtn.setAttribute('aria-pressed', String(present));
        each('#env-group button', function (b) {
          b.setAttribute('aria-pressed', String(b.dataset.env === state.env));
        });
        each('#view-group button', function (b) {
          b.setAttribute('aria-pressed', String(b.dataset.view === state.view));
        });
        var src = frameSrc();
        if (frame.getAttribute('src') !== src) frame.setAttribute('src', src);
        openBtn.setAttribute('href', state.env + '/' + state.view + '.html');
        var hash = '#' + state.env + '/' + state.view;
        if (location.hash !== hash) history.replaceState(null, '', hash);
        persist();
      }

      function each(sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }

      document.getElementById('env-group').addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        state.env = b.dataset.env; render();
      });
      document.getElementById('view-group').addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        state.view = b.dataset.view; render();
      });
      themeBtn.addEventListener('click', function () {
        state.theme = state.theme === 'dark' ? 'light' : 'dark'; render();
      });
      presentBtn.addEventListener('click', function () {
        // toggle — so it still works if the browser blocks fullscreen
        present = !present;
        render();
        if (present) {
          var go = frame.requestFullscreen || frame.webkitRequestFullscreen;
          if (go) { try { go.call(frame); } catch (_) {} }
        } else if (document.fullscreenElement) {
          try { document.exitFullscreen(); } catch (_) {}
        }
      });
      document.addEventListener('fullscreenchange', function () {
        if (!document.fullscreenElement && present) { present = false; render(); }
      });
      window.addEventListener('hashchange', function () {
        var h = parseHash();
        if (h && (h.env !== state.env || h.view !== state.view)) { state.env = h.env; state.view = h.view; render(); }
      });

      render();
    })();
  </script>
</body>
</html>
