name: ${COMPOSE_PROJECT_NAME:-crm}

x-app-defaults: &app-defaults
  init: true
  restart: unless-stopped
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m

services:
  crm-api-1:
    <<: *app-defaults
    build:
      context: .
      dockerfile: docker/crm-server/Dockerfile
    environment: &crm-environment
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://crm.example.com}
      APP_KEY_FILE: /run/secrets/laravel_app_key
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${CRM_DB_NAME:-crm}
      DB_USERNAME: ${CRM_DB_USER:-crm_app}
      DB_PASSWORD_FILE: /run/secrets/crm_db_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: crm
      REDIS_PASSWORD_FILE: /run/secrets/crm_redis_password
      REDIS_PREFIX: "crm:"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      MEDIA_DISK: public
      HORIZON_PREFIX: "crm:horizon:"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-crm}
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      RABBITMQ_VHOST: /
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - laravel_private:/var/www/html/storage/app/private
      - laravel_media:/var/www/html/storage/app/public
      - type: tmpfs
        target: /var/www/html/bootstrap/cache
        tmpfs: {size: 33554432, mode: "0777"}
      - type: tmpfs
        target: /var/www/html/storage/framework
        tmpfs: {size: 67108864, mode: "0777"}
      - type: tmpfs
        target: /var/www/html/storage/logs
        tmpfs: {size: 33554432, mode: "0777"}
      - type: tmpfs
        target: /var/www/html/storage/media-library/temp
        tmpfs: {size: 134217728, mode: "0777"}
    expose: ["9000"]
    networks: [proxy_net, data_net, egress_net]
    secrets: [laravel_app_key, crm_db_password, crm_redis_password, rabbitmq_password]
    depends_on:
      crm-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 10s
      timeout: 5s
      retries: 5

  crm-api-2:
    <<: *app-defaults
    build:
      context: .
      dockerfile: docker/crm-server/Dockerfile
    environment: *crm-environment
    volumes:
      - laravel_private:/var/www/html/storage/app/private
      - laravel_media:/var/www/html/storage/app/public
      - type: tmpfs
        target: /var/www/html/bootstrap/cache
        tmpfs: {size: 33554432, mode: "0777"}
      - type: tmpfs
        target: /var/www/html/storage/framework
        tmpfs: {size: 67108864, mode: "0777"}
      - type: tmpfs
        target: /var/www/html/storage/logs
        tmpfs: {size: 33554432, mode: "0777"}
      - type: tmpfs
        target: /var/www/html/storage/media-library/temp
        tmpfs: {size: 134217728, mode: "0777"}
    expose: ["9000"]
    networks: [proxy_net, data_net, egress_net]
    secrets: [laravel_app_key, crm_db_password, crm_redis_password, rabbitmq_password]
    depends_on:
      crm-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  payment-events:
    <<: *app-defaults
    build:
      context: .
      dockerfile: docker/crm-server/Dockerfile
    environment: *crm-environment
    profiles: ["payments"]
    command: ["php", "artisan", "payments:consume-events"]
    volumes:
      - laravel_media:/var/www/html/storage/app/public
      - type: tmpfs
        target: /var/www/html/bootstrap/cache
        tmpfs: {size: 33554432, mode: "0777"}
      - type: tmpfs
        target: /var/www/html/storage/framework
        tmpfs: {size: 67108864, mode: "0777"}
      - type: tmpfs
        target: /var/www/html/storage/logs
        tmpfs: {size: 33554432, mode: "0777"}
      - type: tmpfs
        target: /var/www/html/storage/media-library/temp
        tmpfs: {size: 134217728, mode: "0777"}
    networks: [data_net, egress_net]
    secrets: [laravel_app_key, crm_db_password, crm_redis_password, rabbitmq_password]
    depends_on:
      crm-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 10s
      timeout: 5s
      retries: 5

  crm-migrate:
    build:
      context: .
      dockerfile: docker/crm-server/Dockerfile
    restart: "no"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      <<: *crm-environment
    volumes:
      - laravel_media:/var/www/html/storage/app/public
      - type: tmpfs
        target: /var/www/html/bootstrap/cache
        tmpfs: {size: 33554432, mode: "0777"}
      - type: tmpfs
        target: /var/www/html/storage/framework
        tmpfs: {size: 67108864, mode: "0777"}
      - type: tmpfs
        target: /var/www/html/storage/logs
        tmpfs: {size: 33554432, mode: "0777"}
      - type: tmpfs
        target: /var/www/html/storage/media-library/temp
        tmpfs: {size: 134217728, mode: "0777"}
    networks: [data_net, egress_net]
    secrets: [laravel_app_key, crm_db_password, crm_redis_password, rabbitmq_password]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["php", "artisan", "migrate", "--force", "--seed"]

  auth-grants:
    <<: *app-defaults
    image: docker.io/library/postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      CRM_DB_NAME: ${CRM_DB_NAME:-crm}
      AUTH_DB_USER: ${PAYMENTS_AUTH_DB_USER:-auth_reader}
      AUTH_DB_PASSWORD_FILE: /run/secrets/auth_db_password
      AUTH_SEED_DB_USER: ${PAYMENTS_AUTH_DB_SEED_USER:-auth_seeder}
      AUTH_SEED_PASSWORD_FILE: /run/secrets/auth_seed_db_password
      PGHOST: postgres
    volumes:
      - ./docker/postgres/grant-auth-access.sh:/usr/local/bin/grant-auth-access:ro
    networks: [data_net]
    secrets: [postgres_password, auth_db_password, auth_seed_db_password]
    depends_on:
      crm-migrate:
        condition: service_completed_successfully
    command: ["/bin/sh", "/usr/local/bin/grant-auth-access"]

  payment-api-1:
    <<: *app-defaults
    build:
      context: .
      dockerfile: docker/payment-server/Dockerfile
    environment: &payment-environment
      NODE_ENV: production
      PORT: 3000
      PAYMENTS_DB_HOST: postgres
      PAYMENTS_DB_PORT: 5432
      PAYMENTS_DB_NAME: ${PAYMENTS_DB_NAME:-payments}
      PAYMENTS_DB_USER: ${PAYMENTS_DB_USER:-payments_app}
      PAYMENTS_DB_PASSWORD_FILE: /run/secrets/payments_db_password
      PAYMENTS_AUTH_DB_HOST: postgres
      PAYMENTS_AUTH_DB_PORT: 5432
      PAYMENTS_AUTH_DB_NAME: ${PAYMENTS_AUTH_DB_NAME:-crm}
      PAYMENTS_AUTH_DB_USER: ${PAYMENTS_AUTH_DB_USER:-auth_reader}
      PAYMENTS_AUTH_DB_PASSWORD_FILE: /run/secrets/auth_db_password
      PAYMENTS_REDIS_HOST: redis
      PAYMENTS_REDIS_PORT: 6379
      PAYMENTS_REDIS_USERNAME: payments
      PAYMENTS_REDIS_PASSWORD_FILE: /run/secrets/payments_redis_password
      PAYMENTS_REDIS_PREFIX: "payments:"
      PAYMENTS_MIGRATIONS_RUN: "true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-crm}
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      RABBITMQ_VHOST: /
      PAYMENTS_DB_ENABLED: "true"
    networks: [proxy_net, data_net, egress_net]
    secrets: [payments_db_password, payments_redis_password, auth_db_password, rabbitmq_password]
    depends_on:
      postgres:
        condition: service_healthy
      auth-grants:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/v1/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-api-2:
    <<: *app-defaults
    build:
      context: .
      dockerfile: docker/payment-server/Dockerfile
    environment: *payment-environment
    networks: [proxy_net, data_net, egress_net]
    secrets: [payments_db_password, payments_redis_password, auth_db_password, rabbitmq_password]
    depends_on:
      postgres:
        condition: service_healthy
      auth-grants:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/v1/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-auth-seed:
    profiles: [seed]
    <<: *app-defaults
    build:
      context: .
      dockerfile: docker/payment-server/Dockerfile
    environment:
      NODE_ENV: production
      PAYMENTS_AUTH_DB_HOST: postgres
      PAYMENTS_AUTH_DB_PORT: 5432
      PAYMENTS_AUTH_DB_NAME: ${PAYMENTS_AUTH_DB_NAME:-crm}
      PAYMENTS_AUTH_DB_USER: ${PAYMENTS_AUTH_DB_SEED_USER:-auth_seeder}
      PAYMENTS_AUTH_DB_PASSWORD_FILE: /run/secrets/auth_seed_db_password
      PAYMENTS_AUTH_SEED_ROLE_NAMES: ${PAYMENTS_AUTH_SEED_ROLE_NAMES:-manager,agent}
    networks: [data_net]
    secrets: [auth_seed_db_password]
    depends_on:
      auth-grants:
        condition: service_completed_successfully
    command: ["node", "dist/seed-auth.js"]

  horizon:
    <<: *app-defaults
    build:
      context: .
      dockerfile: docker/crm-server/Dockerfile
    environment: *crm-environment
    command: ["php", "artisan", "horizon"]
    volumes:
      - laravel_private:/var/www/html/storage/app/private
      - laravel_media:/var/www/html/storage/app/public
      - type: tmpfs
        target: /var/www/html/bootstrap/cache
        tmpfs: {size: 33554432, mode: "0777"}
      - type: tmpfs
        target: /var/www/html/storage/framework
        tmpfs: {size: 67108864, mode: "0777"}
      - type: tmpfs
        target: /var/www/html/storage/logs
        tmpfs: {size: 33554432, mode: "0777"}
      - type: tmpfs
        target: /var/www/html/storage/media-library/temp
        tmpfs: {size: 134217728, mode: "0777"}
    networks: [data_net, egress_net]
    secrets: [laravel_app_key, crm_db_password, crm_redis_password, rabbitmq_password]
    depends_on:
      crm-migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *app-defaults
    build:
      context: .
      dockerfile: docker/crm-server/Dockerfile
    environment: *crm-environment
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - laravel_private:/var/www/html/storage/app/private
      - laravel_media:/var/www/html/storage/app/public
      - type: tmpfs
        target: /var/www/html/bootstrap/cache
        tmpfs: {size: 33554432, mode: "0777"}
      - type: tmpfs
        target: /var/www/html/storage/framework
        tmpfs: {size: 67108864, mode: "0777"}
      - type: tmpfs
        target: /var/www/html/storage/logs
        tmpfs: {size: 33554432, mode: "0777"}
      - type: tmpfs
        target: /var/www/html/storage/media-library/temp
        tmpfs: {size: 134217728, mode: "0777"}
    networks: [data_net, egress_net]
    secrets: [laravel_app_key, crm_db_password, crm_redis_password, rabbitmq_password]
  depends_on:
      crm-migrate:
        condition: service_completed_successfully

  dashboard-1:
    <<: *app-defaults
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    networks: [proxy_net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard-2:
    <<: *app-defaults
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    networks: [proxy_net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: docker.io/library/postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    shm_size: 64m
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      CRM_DB_NAME: ${CRM_DB_NAME:-crm}
      CRM_DB_USER: ${CRM_DB_USER:-crm_app}
      CRM_DB_PASSWORD_FILE: /run/secrets/crm_db_password
      PAYMENTS_DB_NAME: ${PAYMENTS_DB_NAME:-payments}
      PAYMENTS_DB_USER: ${PAYMENTS_DB_USER:-payments_app}
      PAYMENTS_DB_PASSWORD_FILE: /run/secrets/payments_db_password
      AUTH_DB_USER: ${PAYMENTS_AUTH_DB_USER:-auth_reader}
      AUTH_DB_PASSWORD_FILE: /run/secrets/auth_db_password
      AUTH_SEED_DB_USER: ${PAYMENTS_AUTH_DB_SEED_USER:-auth_seeder}
      AUTH_SEED_DB_PASSWORD_FILE: /run/secrets/auth_seed_db_password
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init/01-create-application-databases.sh:/docker-entrypoint-initdb.d/01-create-application-databases.sh:ro
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    networks: [data_net]
    secrets: [postgres_password, crm_db_password, payments_db_password, auth_db_password, auth_seed_db_password]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/redis-entrypoint"]
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    environment:
      CRM_REDIS_PASSWORD_FILE: /run/secrets/crm_redis_password
      PAYMENTS_REDIS_PASSWORD_FILE: /run/secrets/payments_redis_password
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./docker/redis/entrypoint.sh:/usr/local/bin/redis-entrypoint:ro
    networks: [data_net]
    secrets: [crm_redis_password, payments_redis_password]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user crm --pass \"$$(cat /run/secrets/crm_redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: docker.io/library/rabbitmq:4.1-management-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/rabbitmq-entrypoint"]
    command: ["rabbitmq-server"]
    environment:
      RABBITMQ_BOOTSTRAP_USER: ${RABBITMQ_USER:-crm}
      RABBITMQ_BOOTSTRAP_PASSWORD_FILE: /run/secrets/rabbitmq_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/entrypoint.sh:/usr/local/bin/rabbitmq-entrypoint:ro
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks: [data_net]
    secrets: [rabbitmq_password]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  gateway:
    image: docker.io/library/nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    init: true
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/upstreams.conf:/etc/nginx/upstreams.conf:ro
      - laravel_media:/var/www/html/public/storage:ro
    networks: [proxy_net]
    depends_on:
      crm-api-1:
        condition: service_healthy
      crm-api-2:
        condition: service_healthy
      payment-api-1:
        condition: service_healthy
      payment-api-2:
        condition: service_healthy
      dashboard-1:
        condition: service_healthy
      dashboard-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  laravel_media:
  laravel_private:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  proxy_net:
  data_net:
    internal: true
  egress_net:

secrets:
  laravel_app_key:
    file: ${LARAVEL_APP_KEY_FILE:-.secrets/laravel_app_key}
    x-podman.relabel: z
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-.secrets/postgres_password}
    x-podman.relabel: z
  crm_db_password:
    file: ${CRM_DB_PASSWORD_FILE:-.secrets/crm_db_password}
    x-podman.relabel: z
  payments_db_password:
    file: ${PAYMENTS_DB_PASSWORD_FILE:-.secrets/payments_db_password}
    x-podman.relabel: z
  auth_db_password:
    file: ${PAYMENTS_AUTH_DB_PASSWORD_FILE:-.secrets/auth_db_password}
    x-podman.relabel: z
  auth_seed_db_password:
    file: ${PAYMENTS_AUTH_DB_SEED_PASSWORD_FILE:-.secrets/auth_seed_db_password}
    x-podman.relabel: z
  crm_redis_password:
    file: ${CRM_REDIS_PASSWORD_FILE:-.secrets/crm_redis_password}
    x-podman.relabel: z
  payments_redis_password:
    file: ${PAYMENTS_REDIS_PASSWORD_FILE:-.secrets/payments_redis_password}
    x-podman.relabel: z
  rabbitmq_password:
    file: ${RABBITMQ_PASSWORD_FILE:-.secrets/rabbitmq_password}
    x-podman.relabel: z
