pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    sendfile on;
    keepalive_timeout 30;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok\n';
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Generated static doc apps under /docs/<app>/ — the Liam ERDs
        # (/docs/db/<name>/, see docs/db/README.md) and the archify architecture
        # views (/docs/architecture/, flat pages like /docs/architecture/sequence).
        # For an extension-less path try the file, then <path>.html (flat page),
        # then a trailing-slash redirect (sub-app directory). Never fall through
        # to the dashboard SPA.
        location ~ ^/docs/([^/]+/)?[^/.]+$ {
            try_files $uri $uri.html @docs_trailing_slash;
        }

        location @docs_trailing_slash {
            return 301 $uri/;
        }

        location /docs/ {
            try_files $uri $uri.html $uri/ =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
