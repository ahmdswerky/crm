worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    sendfile on;
    keepalive_timeout 30;
    resolver 127.0.0.11 valid=5s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    include /etc/nginx/upstreams.conf;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        client_max_body_size 16m;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok\n';
        }

        location = /up {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param REQUEST_URI /up;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_pass crm_pool;
        }

        location = /internal/health/ready {
            internal;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param REQUEST_URI /_health/ready;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_pass crm_pool;
        }

        location = /api/v1/payments {
            client_max_body_size 1m;
            proxy_pass http://payment_pool;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Connection '';
            proxy_next_upstream off;
        }

        location ^~ /api/v1/payments/ {
            client_max_body_size 1m;
            proxy_pass http://payment_pool;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Connection '';
            proxy_next_upstream off;
        }

        # The payment API uses the plural invoices resource. Keep the old
        # singular path out of the payment upstream instead of relying on the
        # generic Laravel API location to handle it.
        location = /api/v1/invoice {
            return 404;
        }

        location = /api/v1/invoices {
            client_max_body_size 1m;
            proxy_pass http://payment_pool;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Connection '';
            proxy_next_upstream off;
        }

        location ^~ /api/v1/invoices/ {
            client_max_body_size 1m;
            proxy_pass http://payment_pool;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Connection '';
            proxy_next_upstream off;
        }

        location ^~ /api/ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param HTTP_X_REAL_IP $http_x_real_ip;
            fastcgi_pass crm_pool;
            fastcgi_keep_conn on;
            fastcgi_read_timeout 120s;
        }

        location ~ ^/(telescope|horizon)(/|$) {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param HTTP_X_REAL_IP $http_x_real_ip;
            fastcgi_pass crm_pool;
            fastcgi_keep_conn on;
            fastcgi_read_timeout 120s;
        }

        location ^~ /storage/ {
            alias /var/www/html/public/storage/app/public/;
            try_files $uri =404;
            access_log off;
        }

        location / {
            proxy_pass http://dashboard_pool;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 120s;
            proxy_next_upstream off;
        }
    }
}
